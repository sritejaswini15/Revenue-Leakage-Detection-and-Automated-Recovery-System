name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recoverx_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:postgres@localhost:5432/recoverx_test' || '' }}
      # Production builds its schema from migrations only: they must match the models exactly.
      - name: Migrations match the models
        if: matrix.database == 'sqlite'
        run: alembic upgrade head && alembic check
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./migration-check.db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          BOOTSTRAP_RAZORPAY_ACCOUNT_ID=acct_ci nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
      - name: Build and start web app
        working-directory: frontend
        run: |
          npm ci
          NEXT_PUBLIC_API_URL=$E2E_API_URL npm run build
          nohup npm run start > web.log 2>&1 &
          npx playwright install --with-deps chromium
      - name: Wait for services
        run: |
          curl --retry 30 --retry-connrefused --retry-delay 2 -fsS $E2E_API_URL/health
          curl --retry 30 --retry-connrefused --retry-delay 2 -fsS -o /dev/null $E2E_BASE_URL/login
      - name: Run end-to-end tests
        working-directory: frontend
        run: npx playwright test
      - name: Service logs
        if: failure()
        run: cat backend/api.log frontend/web.log
